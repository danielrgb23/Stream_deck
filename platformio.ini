; Xeeta Streamer firmware
;
; Um unico core, tres modelos: essential, streamer, creator_pro.
; O modelo e selecionado exclusivamente pela flag de build DEVICE_MODEL
; (ver src/core/DeviceModel.h) — nenhum codigo-fonte e duplicado entre modelos.

[platformio]
default_envs = essential, streamer, creator_pro

[env]
framework = arduino
monitor_speed = 115200
; Adaptadores CH340 (comuns em clones de ESP32 WROOM-32) costumam falhar no
; upload_speed padrao do esptool (921600) — 115200 e mais lento mas confiavel.
upload_speed = 115200

; --- Essential: sem tela, apenas matriz de botoes. Chip sem USB nativo -> BLE HID. ---
[env:essential]
platform = espressif32
board = esp32dev
build_flags =
    -D DEVICE_MODEL=ESSENTIAL
    -D HID_TRANSPORT=HID_TRANSPORT_BLE
build_src_filter =
    +<*>
    -<models/streamer> -<models/creator_pro>
    -<hal/streamer> -<hal/creator_pro>
    -<core/hid/usb>
lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2

; --- Streamer: matriz de botoes + encoder + display OLED. Chip sem USB nativo -> BLE HID. ---
[env:streamer]
platform = espressif32
board = esp32dev
build_flags =
    -D DEVICE_MODEL=STREAMER
    -D HID_TRANSPORT=HID_TRANSPORT_BLE
build_src_filter =
    +<*>
    -<models/essential> -<models/creator_pro>
    -<hal/essential> -<hal/creator_pro>
    -<core/hid/usb>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    t-vk/ESP32 BLE Keyboard@^0.3.2

; --- Creator Pro: touchscreen TFT. Chip com USB nativo (ESP32-S3) -> USB HID. ---
[env:creator_pro]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -D DEVICE_MODEL=CREATOR_PRO
    -D HID_TRANSPORT=HID_TRANSPORT_USB
build_src_filter =
    +<*>
    -<models/essential> -<models/streamer>
    -<hal/essential> -<hal/streamer> -<hal/common>
    -<core/hid/ble>
